# Runs every automated check on each push: the rules, the server function, the database guards and the translations.
name: Checks
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Rules (rules.js)
        run: deno run --allow-read tools/test-rules.js

      - name: Server function (Gemini and the database stubbed)
        run: GEMINI_API_KEY=test deno run --allow-net --allow-env supabase/functions/classify-waste/test.ts

      - name: Translations
        run: deno run --allow-read tools/check-translations.js

      - name: Database guards and per-role access on a real Postgres
        run: |
          # Stand-ins for the Supabase pieces the SQL expects: roles, the realtime publication, and auth's users + uid()
          psql -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin; create publication supabase_realtime;
            create schema auth; create table auth.users (id uuid primary key, email text);
            create function auth.uid() returns uuid language sql stable as \$\$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid \$\$;
            grant usage on schema public, auth to anon, authenticated; grant execute on function auth.uid() to anon, authenticated;"
          psql -v ON_ERROR_STOP=1 -f supabase-setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/auth-roles.sql
          # Supabase grants table access to its API roles by default; the policies then decide row by row
          psql -v ON_ERROR_STOP=1 -c "grant select, insert, update, delete on public.bags, public.redemptions to anon, authenticated; grant select on public.profiles to authenticated; grant usage on all sequences in schema public to authenticated;"
          # The test always ends by raising "ALL n CHECKS PASSED" so that it rolls back; anything else is a failure
          psql -f supabase/guard-test.sql 2>&1 | tee guard.log || true
          grep -q "CHECKS PASSED" guard.log
          psql -f supabase/auth-test.sql 2>&1 | tee auth.log || true
          grep -q "ROLE CHECKS PASSED" auth.log
